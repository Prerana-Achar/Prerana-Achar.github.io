<body class="contact-page">
<header class="site-header"><a class="brand" href="./" aria-label="Aroha home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>aroha<span class="brand-dot">.</span></a><nav aria-label="Main navigation"><a class="practice-link" href="./">Practice room</a><a class="nav-active contact-link" href="contact.html" aria-current="page">Contact me</a></nav></header>
<main>
 <section class="contact-card" aria-labelledby="contact-title">
  <h1 id="contact-title">Contact me</h1>
  <p>Have a question or feedback about Aroha?</p>
  <form id="contact-form" action="mailto:peruachar16@gmail.com?subject=Aroha" method="post" enctype="text/plain">
   <label for="contact-type">What is it about?</label>
   <select id="contact-type" name="Type"><option value="Question">Question</option><option value="Feedback">Feedback</option></select>
   <label for="contact-name">Name <span class="contact-optional">(optional)</span></label>
   <input id="contact-name" name="Name" type="text" autocomplete="name" maxlength="80">
   <label for="contact-message">Message</label>
   <textarea id="contact-message" name="Message" rows="7" maxlength="3500" required aria-describedby="contact-hint"></textarea>
   <p id="contact-hint" class="field-help">Opens your email app with the subject “Aroha.” Review and send your message there.</p>
   <button class="button primary" type="submit">Open email <span aria-hidden="true">↗</span></button>
   <p id="contact-status" class="field-help" role="status" aria-live="polite"></p>
  </form>
  <p class="contact-direct">Or email <a href="mailto:peruachar16@gmail.com?subject=Aroha">peruachar16@gmail.com</a> directly.</p>
 </section>
 <footer><a class="brand footer-brand" href="./">aroha.</a><span>Learning music made easy</span></footer>
</main>
</body>
</html>
